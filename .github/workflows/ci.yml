name: H4CKR CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── Backend tests ────────────────────────────────────────
  backend:
    name: Backend — lint + tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: h4ckr
          POSTGRES_PASSWORD: h4ckr_secure_password
          POSTGRES_DB: h4ckr_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt flake8 pytest-cov requests pytest-asyncio

      - name: Install psql client
        run: sudo apt-get install -y postgresql-client

      - name: Charger les données SQL
        env:
          PGPASSWORD: h4ckr_secure_password
        run: psql -h localhost -U h4ckr -d h4ckr_db -f ${{ github.workspace }}/backend/app/db/init.sql

      - name: Lint — Flake8
        run: flake8 app/ --max-line-length=999 --exclude=__pycache__ --ignore=E302,E303,E305,E401,E501,E701,E712,E128,W292,W293,W503,W504,F401,F811

      - name: Tests unitaires + couverture
        env:
          DATABASE_URL: postgresql://h4ckr:h4ckr_secure_password@localhost:5432/h4ckr_db
          SECRET_KEY: test_secret_key
          ALGORITHM: HS256
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_e2e.py \
            --cov=app/services/enigmes \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            -v

  # ── Frontend lint + build ────────────────────────────────
  frontend:
    name: Frontend — lint + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint — ESLint
        run: npm run lint

      - name: Build
        env:
          VITE_API_URL: https://h4-ckr.vercel.app/api
        run: npm run build

  # ── Deploy — Vercel (uniquement sur main) ─────────────────
  deploy:
    name: Deploy → Vercel
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend
        run: npx vercel --token=${{ secrets.VERCEL_TOKEN }} --prod --cwd ${{ github.workspace }}/backend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BACKEND }}

      - name: Deploy frontend
        run: npx vercel --token=${{ secrets.VERCEL_TOKEN }} --prod --cwd ${{ github.workspace }}/frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}