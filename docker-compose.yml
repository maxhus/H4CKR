version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: h4ckr_postgres
    environment:
      POSTGRES_USER: h4ckr
      POSTGRES_PASSWORD: h4ckr_secure_password
      POSTGRES_DB: h4ckr_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U h4ckr"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - h4ckr_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: h4ckr_backend
    environment:
      DATABASE_URL: postgresql://h4ckr:h4ckr_secure_password@postgres:5432/h4ckr_db
      SECRET_KEY: h4ckr_super_secret_key_2024_nexus_corp
      ALGORITHM: HS256
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - h4ckr_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api
    container_name: h4ckr_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - h4ckr_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  h4ckr_network:
    driver: bridge