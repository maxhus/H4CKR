services:
  postgres:
    image: postgres:15
    container_name: h4ckr_postgres
    environment:
      POSTGRES_USER: h4ckr
      POSTGRES_PASSWORD: h4ckr_secure_password
      POSTGRES_DB: h4ckr_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U h4ckr -d h4ckr_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: h4ckr_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://h4ckr:h4ckr_secure_password@postgres:5432/h4ckr_db
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: h4ckr_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: